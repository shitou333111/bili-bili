            # release 目录名带版本号：release-<版本>-<日期>-<时间>
            # 版本号+日期都从目录名解析（见下方 extract_meta），保证 versions.json 里
            # 每平台版本号与它实际指向的安装包一一对应。
            RELEASE_DIR="${ARTIFACTS_DIR}/release-${APP_VERSION}-${{ steps.ts.outputs.BUILD_TS }}"
            mkdir -p "${ARTIFACTS_DIR}" "${RELEASE_DIR}"
            cp -a "${STAGING_DIR}/." "${RELEASE_DIR}/"
            if [ -d "${RELEASE_DIR}/webapp" ]; then
              mkdir -p "${ARTIFACTS_DIR}/webapp"
