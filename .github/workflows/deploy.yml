            fi
            pick_release() {
              local dir="$1" ext="$2"
              [ -d "$dir" ] || return 1
              local f
              for f in "$dir"/*release*"$ext"; do [ -f "$f" ] && { echo "$f"; return 0; }; done
              for f in "$dir"/*"$ext"; do
                [ -f "$f" ] || continue
                case "$(basename "$f")" in *debug*|*DEBUG*) continue;; *) echo "$f"; return 0;; esac
              done
              for f in "$dir"/*"$ext"; do [ -f "$f" ] && { echo "$f"; return 0; }; done
              return 1
            }
            PICKED_EXE="$(pick_release "${RELEASE_DIR}" ".exe" || true)"
            PICKED_APK="$(pick_release "${RELEASE_DIR}" ".apk" || true)"
            PICKED_IPA="$(pick_release "${RELEASE_DIR}" ".ipa" || true)"
            if [ -n "${PICKED_EXE}" ]; then ln -sfn "${PICKED_EXE}" "${ARTIFACTS_DIR}/current_exe"; fi
            if [ -n "${PICKED_APK}" ]; then ln -sfn "${PICKED_APK}" "${ARTIFACTS_DIR}/current_apk"; fi
            if [ -n "${PICKED_IPA}" ]; then ln -sfn "${PICKED_IPA}" "${ARTIFACTS_DIR}/current_ipa"; fi
            extract_meta() {
