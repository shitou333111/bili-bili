name: Deploy & Build

on:
  push:
    branches: [ main, native-client ]
  workflow_dispatch:
    inputs:
      server_url:
        description: "服务器地址（留空则使用 Secrets 中的 NEXT_PUBLIC_SERVER_URL；可手动填入本地地址用于本地测试）"
        required: false
        type: string
        default: ""
      debug:
        description: "打包 Debug 版本（不勾选则默认 Release）"
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-build-${{ github.ref }}
  cancel-in-progress: false

# ==================== 构建触发逻辑 ====================
# 通过 commit 关键词触发不同作业：
#   server -> 部署服务器（SSH 上传 + pm2 重启）
#   exe    -> Windows EXE
#   apk    -> Android APK
#   ipa    -> iOS IPA
# 例如 "exe apk" 会同时构建 EXE 和 APK。
# 关键词 "debug" 使所有客户端构建使用 Debug 包（对 server 部署无影响）。
#
# 服务器地址优先级（仅客户端构建用）：
#   1. commit 含 "local" 关键字 → 强制使用 http://192.168.1.2:3000（本地开发）
#   2. workflow_dispatch 时手动输入的 server_url
#   3. GitHub Secrets 中的 NEXT_PUBLIC_SERVER_URL
#   4. 默认值 http://192.168.1.2:3000（本地测试用）
# 请在 GitHub Settings → Secrets and variables → Actions 中配置 NEXT_PUBLIC_SERVER_URL
#
# 管理后台密码（ADMIN_PASSWORD）：不写死在源码中，部署时由 deploy-server 作业
# 从 Secrets 读取并注入到服务器启动命令（pm2 / nohup 的进程环境变量），
# server.js 运行时通过 process.env.ADMIN_PASSWORD 读取（见 src/lib/auth/admin.ts）。
# 请在 GitHub Settings → Secrets and variables → Actions 中配置 ADMIN_PASSWORD

env:
  SERVER_URL: ${{ (github.event_name == 'push' && contains(github.event.head_commit.message, 'local')) && 'http://192.168.1.2:3000' || inputs.server_url || secrets.NEXT_PUBLIC_SERVER_URL || 'http://192.168.1.2:3000' }}
  # commit message 含 debug 或手动勾选 debug → true（Debug 包），否则 false（Release 包）
  IS_DEBUG: ${{ (github.event_name == 'workflow_dispatch' && inputs.debug == true) || (github.event_name == 'push' && contains(github.event.head_commit.message, 'debug')) }}
  # 本次 CI run 的热更新 SEQUENCE（= build-hot-update 用的 github.run_number）。
  # 注入到前端作为"内置 sequence"：原生包与热更新包基于相同源码、同一 run 构建，
  # 插件在本地无热更新缓存时 current_sequence=0 会误报"找到热更新"；
  # 前端用它抑制"原生包已内建最新内容"的误报（见 updater.ts checkHotUpdate）。
  NEXT_PUBLIC_BUILD_SEQ: ${{ github.run_number }}

jobs:
  # ==================== 服务器部署 ====================
  deploy-server:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, 'server'))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Prepare deploy artifacts
        run: |
          # Next.js standalone 输出结构:
          # .next/standalone/  -> Node.js 服务端代码 + node_modules
          # .next/static/      -> 静态资源 (JS/CSS/图片)
          # public/            -> 公共静态文件

          mkdir -p deploy-dist

          # 复制 standalone 服务端
          cp -r .next/standalone/. deploy-dist/

          # 复制静态资源到 standalone 目录内
          mkdir -p deploy-dist/.next/static
          cp -r .next/static/. deploy-dist/.next/static/

          # 关键：Next.js 16 + Turbopack 的 standalone 产物缺少 .next/server/chunks
          # （SSR chunks），server.js 运行时 require 不到会全站 500（Cannot find module）。
          # 从完整构建输出补入，修复部署后无法加载 SSR chunk 的问题。
          mkdir -p deploy-dist/.next/server
          cp -r .next/server/chunks deploy-dist/.next/server/chunks

          # 复制 public 目录
          if [ -d public ]; then
            cp -r public/. deploy-dist/public/
          fi

      - name: Upload dist to server
        id: scp-dist
        uses: appleboy/scp-action@v0.1.7
        continue-on-error: true
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: deploy-dist/*
          target: /tmp/bili_live-deploy
          overwrite: true
          strip_components: 1
          timeout: 120s
          command_timeout: 120s

      - name: Retry upload dist (wait 15s)
        if: steps.scp-dist.outcome == 'failure'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: deploy-dist/*
          target: /tmp/bili_live-deploy
          overwrite: true
          strip_components: 1
          timeout: 120s
          command_timeout: 120s

      # 在 runner 上解析版本名（GITHUB_RUN_ID/ATTEMPT 只存在于 runner，
      # 不能直接在 ssh 脚本里用 ${GITHUB_RUN_ID}，否则到服务器上被展开为空值，
      # 导致所有版本都落到 release-- 目录，原子版本管理失效）
      - name: Resolve release name
        id: release-name
        run: echo "RELEASE_NAME=release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Atomic deploy on server
        id: ssh-deploy
        uses: appleboy/ssh-action@v1.0.3
        continue-on-error: true
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 30m
          script: |
            set -e
            TARGET_DIR="${{ secrets.SSH_TARGET_DIR }}"
            RELEASES_DIR="${TARGET_DIR}/.releases"
            RELEASE_DIR="${RELEASES_DIR}/${{ steps.release-name.outputs.RELEASE_NAME }}"
            CURRENT_DIR="${TARGET_DIR}/current"
            PRESERVE_DIR="${TARGET_DIR}/preserved"
            LAST_RELEASE="$(ls -1dt "${RELEASES_DIR}"/release-* 2>/dev/null | head -n 1 || true)"

            mkdir -p "${PRESERVE_DIR}"

            # Bootstrap preserved data from current or latest release.
            # .data/ 目录存储用户记录、盲盒数据、admin配置等，必须跨版本保留
            if [ ! -d "${PRESERVE_DIR}/.data" ]; then
              if [ -d "${CURRENT_DIR}/.data" ]; then
                cp -a "${CURRENT_DIR}/.data" "${PRESERVE_DIR}/.data"
              elif [ -n "${LAST_RELEASE}" ] && [ -d "${LAST_RELEASE}/.data" ]; then
                cp -a "${LAST_RELEASE}/.data" "${PRESERVE_DIR}/.data"
              else
                mkdir -p "${PRESERVE_DIR}/.data"
              fi
            fi

            # 创建新版本目录
            mkdir -p "$RELEASE_DIR"
            cp -a /tmp/bili_live-deploy/. "$RELEASE_DIR/"

            # 用符号链接挂载持久化数据目录
            rm -rf "${RELEASE_DIR:?}/.data"
            ln -sfn "${PRESERVE_DIR}/.data" "${RELEASE_DIR}/.data"

            # 原子切换 current 指针
            ln -sfn "$RELEASE_DIR" "${TARGET_DIR}/current"

            # 启动/重启服务
            if command -v pm2 >/dev/null 2>&1; then
              # 关键：必须 delete 后重新 start，不能直接 restart！
              # pm2 会把启动时 server.js 的符号链接解析成真实路径并缓存（pm_exec_path），
              # restart 沿用缓存的旧路径执行，即使 current 已切换到新版本仍跑旧代码，导致页面不更新。
              # delete 后以当前 current 目录重新 start，让 pm2 重新解析到最新版本路径。
              pm2 delete bili-live >/dev/null 2>&1 || true
              cd "${TARGET_DIR}/current"
              HOST=127.0.0.1 PORT=3000 ADMIN_PASSWORD="${{ secrets.ADMIN_PASSWORD }}" pm2 start server.js --name bili-live
              pm2 save || true
            else
              PID_FILE="${TARGET_DIR}/server.pid"
              if [ -f "${PID_FILE}" ]; then
                OLD_PID="$(cat "${PID_FILE}" 2>/dev/null || true)"
                if [ -n "${OLD_PID}" ] && kill -0 "${OLD_PID}" 2>/dev/null; then
                  kill "${OLD_PID}" || true
                fi
                rm -f "${PID_FILE}"
              fi

              cd "${TARGET_DIR}/current"
              HOST=127.0.0.1 PORT=3000 ADMIN_PASSWORD="${{ secrets.ADMIN_PASSWORD }}" nohup node server.js > "${TARGET_DIR}/server.log" 2>&1 &
              echo $! > "${PID_FILE}"
            fi

            # 清理旧版本，保留最近 5 个
            ls -1dt "${RELEASES_DIR}"/release-* 2>/dev/null | tail -n +6 | xargs -r rm -rf

      - name: Retry atomic deploy (wait 15s)
        if: steps.ssh-deploy.outcome == 'failure'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 30m
          script: |
            set -e
            TARGET_DIR="${{ secrets.SSH_TARGET_DIR }}"
            RELEASES_DIR="${TARGET_DIR}/.releases"
            RELEASE_DIR="${RELEASES_DIR}/${{ steps.release-name.outputs.RELEASE_NAME }}"
            CURRENT_DIR="${TARGET_DIR}/current"
            PRESERVE_DIR="${TARGET_DIR}/preserved"

            rm -rf "${RELEASE_DIR}"
            mkdir -p "${RELEASE_DIR}"
            cp -r /tmp/bili_live-deploy/. "${RELEASE_DIR}/"

            PRESERVE_LIST=""
            for link in current_apk current_exe current_ipa; do
              if [ -L "${TARGET_DIR}/${link}" ]; then
                REAL="$(readlink -f "${TARGET_DIR}/${link}" 2>/dev/null || true)"
                if [ -n "${REAL}" ]; then PRESERVE_LIST="${PRESERVE_LIST} ${REAL}"; fi
              fi
            done

            ln -sfn "${RELEASE_DIR}" "${CURRENT_DIR}"

            PID_FILE="${TARGET_DIR}/server.pid"
            if [ -f "${PID_FILE}" ]; then
              OLD_PID="$(cat "${PID_FILE}" 2>/dev/null || true)"
              if [ -n "${OLD_PID}" ] && kill -0 "${OLD_PID}" 2>/dev/null; then
                kill "${OLD_PID}" || true
              fi
              rm -f "${PID_FILE}"
            fi

            cd "${TARGET_DIR}/current"
            HOST=127.0.0.1 PORT=3000 ADMIN_PASSWORD="${{ secrets.ADMIN_PASSWORD }}" nohup node server.js > "${TARGET_DIR}/server.log" 2>&1 &
            echo $! > "${PID_FILE}"

            # 清理旧版本，保留最近 5 个
            ls -1dt "${RELEASES_DIR}"/release-* 2>/dev/null | tail -n +6 | xargs -r rm -rf

  # ==================== Windows EXE ====================
  build-exe:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, 'exe')) }}
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      # 缓存 ~/.cargo registry 与 target，避免每次 run 重新下载全部 crate 并全量编译依赖
      # workspace 在 src-tauri/ 子目录，必须用 workspaces 显式指定；
      # 否则 rust-cache 只在仓库根找 Cargo.lock（找不到 → 空哈希 da39a3ee → 只存 1KB 空缓存，缓存形同虚设）
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri"

      - name: Install npm dependencies
        run: npm ci --fetch-retries=5 --fetch-retry-mintimeout=10000 --fetch-retry-maxtimeout=60000

      # 前端由 beforeBuildCommand（npm run build:tauri）在 tauri 构建时构建，服务器地址在步骤级提供
      - name: Build Windows EXE
        env:
          NEXT_PUBLIC_SERVER_URL: ${{ env.SERVER_URL }}
        shell: bash
        run: |
          if [ "$IS_DEBUG" = "true" ]; then
            npx tauri build --no-bundle --debug
          else
            npx tauri build --no-bundle
          fi

      - name: Upload EXE (debug)
        if: env.IS_DEBUG == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bili-live-exe-debug
          path: src-tauri/target/debug/*.exe

      - name: Upload EXE (release)
        if: env.IS_DEBUG != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bili-live-exe
          path: src-tauri/target/release/*.exe

  # ==================== Android APK ====================
  build-apk:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, 'apk')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0 ndk;27.0.12077973"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      # 缓存 ~/.cargo registry 与 target，避免每次 run 重新下载全部 crate 并全量编译依赖
      # workspace 在 src-tauri/ 子目录，必须用 workspaces 显式指定；
      # 否则 rust-cache 只在仓库根找 Cargo.lock（找不到 → 空哈希 da39a3ee → 只存 1KB 空缓存，缓存形同虚设）
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri"

      # 缓存 Gradle 依赖与 wrapper，避免每次 run 重新下载 kotlin-stdlib / kotlin-gradle-plugin 等
      # （GitHub Runner 共享 IP 常被 Maven Central 429 限流，缓存可显著减少 Maven 命中次数）。
      # gen/android 由下方 tauri android init 生成，缓存恢复时还不存在，故用固定版本号 key 保证跨 run 命中。
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-v1
          restore-keys: |
            gradle-${{ runner.os }}-v1

      # 注：这里不需要装 libwebkit2gtk-4.1-dev / libappindicator3-dev / librsvg2-dev /
      # patchelf / libssl-dev —— 那些是 Linux 桌面端构建依赖（GTK WebView、系统托盘、
      # ELF rpath、OpenSSL）。APK 是 Android 交叉编译（Rust 用 rustls，图标输入是 PNG），
      # ubuntu-latest 自带的工具已足够。删除后可省去 apt-get update + webkit 大包安装耗时。

      - name: Install npm dependencies
        run: npm ci --fetch-retries=5 --fetch-retry-mintimeout=10000 --fetch-retry-maxtimeout=60000

      - name: Replace default icon with custom icon
        run: cp public/orig_icon.png app-icon.png

      - name: Init Android project
        run: npx tauri android init

      - name: Generate app icons for Android
        run: npx tauri icon public/orig_icon.png

      # ==================== 多窗口 Activity（Android 官方 multi-window 方案）====================
      # Tauri 官方多窗口（https://v2.tauri.app/learn/mobile-multiwindow/）：每个 WebviewWindow
      # 对应一个独立 Android Activity，通过 WebviewWindowBuilder::activity_name() 指定类名。
      # 这里在 tauri android init 生成的项目里注入两个面板 Activity（模拟活动页 / 黑抽页），
      # 并在 AndroidManifest.xml 注册。
      # 包名从 MainActivity.kt 动态推导（tauri 会把 identifier 中的 '-' 转成 '_'，不硬编码）。
      - name: Inject multi-window Activities (Android)
        shell: bash
        run: |
          set -euo pipefail
          MAIN_KT="$(find src-tauri/gen/android/app/src/main/java -name 'MainActivity.kt' | head -n 1)"
          [ -n "$MAIN_KT" ] || { echo "!! 找不到 MainActivity.kt"; exit 1; }
          PKG_DIR="$(dirname "$MAIN_KT")"
          echo "包目录: $PKG_DIR"
          PKG_LINE="$(grep -m1 '^package ' "$MAIN_KT")"
          [ -n "$PKG_LINE" ] || { echo "!! 无法从 MainActivity.kt 读取 package"; exit 1; }

          cat > "$PKG_DIR/ActivityPanelActivity.kt" <<EOF
          $PKG_LINE

          import android.graphics.Color
          import android.os.Bundle
          import android.view.View
          import android.view.ViewGroup

          class ActivityPanelActivity : TauriActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  // 窗口背景透明 + 整棵树背景透明：透出下层模拟器（含直播流）。
                  // 需配合 AndroidManifest 的 android:theme 半透明主题才能让系统合成下层窗口。
                  window.setBackgroundDrawableResource(android.R.color.transparent)
                  makeViewTreeTransparent(window.decorView)
              }

              private fun makeViewTreeTransparent(v: View) {
                  v.setBackgroundColor(Color.TRANSPARENT)
                  if (v is ViewGroup) {
                      for (i in 0 until v.childCount) makeViewTreeTransparent(v.getChildAt(i))
                  }
              }
          }
          EOF

          cat > "$PKG_DIR/RealActivityPanelActivity.kt" <<EOF
          $PKG_LINE

          import android.graphics.Color
          import android.os.Bundle
          import android.view.View
          import android.view.ViewGroup

          class RealActivityPanelActivity : TauriActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.setBackgroundDrawableResource(android.R.color.transparent)
                  makeViewTreeTransparent(window.decorView)
              }

              private fun makeViewTreeTransparent(v: View) {
                  v.setBackgroundColor(Color.TRANSPARENT)
                  if (v is ViewGroup) {
                      for (i in 0 until v.childCount) makeViewTreeTransparent(v.getChildAt(i))
                  }
              }
          }
          EOF

          MANIFEST="src-tauri/gen/android/app/src/main/AndroidManifest.xml"
          # 允许明文 HTTP：复活曲截图页以 iframe 加载 http://<服务器>/screenshot，
          # Android 9+ (API 28+) 默认禁止 cleartext，不加此属性 iframe 将加载不出内容
          # （Tauri 的 Rust HTTP 插件不走 WebView，不受此限制，故其余数据接口正常而 iframe 空白）。
          if ! grep -q 'android:usesCleartextTraffic' "$MANIFEST"; then
            sed -i 's#<application#<application android:usesCleartextTraffic="true"#' "$MANIFEST"
            echo "已为 <application> 添加 android:usesCleartextTraffic=\"true\""
          else
            echo "android:usesCleartextTraffic 已存在，跳过"
          fi
          if ! grep -q 'ActivityPanelActivity' "$MANIFEST"; then
            # android:theme 用框架自带半透明主题，让面板 Activity 透出下层的模拟器窗口（含直播流）
            sed -i 's#</application>#\n    <activity android:name=".ActivityPanelActivity" android:theme="@android:style/Theme.Translucent.NoTitleBar" android:exported="false" android:configChanges="orientation|keyboardHidden|keyboard|screenSize|locale|smallestScreenSize|screenLayout|uiMode" android:hardwareAccelerated="true" />\n    <activity android:name=".RealActivityPanelActivity" android:theme="@android:style/Theme.Translucent.NoTitleBar" android:exported="false" android:configChanges="orientation|keyboardHidden|keyboard|screenSize|locale|smallestScreenSize|screenLayout|uiMode" android:hardwareAccelerated="true" />\n  </application>#' "$MANIFEST"
          fi

          echo "--- 注册的 Activity ---"
          grep -n 'activity android:name' "$MANIFEST"
          echo "--- 新增 Kotlin 文件 ---"
          ls -la "$PKG_DIR"

      # 前端由 beforeBuildCommand（npm run build:tauri）在 tauri 构建时构建，服务器地址在步骤级提供
      - name: Build Android APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
          JAVA_HOME: ${{ env.JAVA_HOME }}
          NEXT_PUBLIC_SERVER_URL: ${{ env.SERVER_URL }}
        run: |
          # Maven Central 偶发 429 限流（GitHub Runner 共享 IP），自动重试 3 次。
          # 依赖已缓存（~/.gradle）+ Rust target 已缓存，重试不会全量重下。
          for i in 1 2 3; do
            echo "===== APK 构建尝试 $i/3 ====="
            if [ "$IS_DEBUG" = "true" ]; then
              npx tauri android build --target aarch64 --debug
            else
              npx tauri android build --target aarch64
            fi
            if [ $? -eq 0 ]; then
              echo "APK 构建成功"
              break
            fi
            echo "!!!! APK 构建失败（第 $i 次），可能是 Maven Central 429 限流，20s 后重试"
            if [ "$i" -ge 3 ]; then
              echo "!!!! APK 构建连续 3 次失败"
              exit 1
            fi
            sleep 20
          done

      # 固定签名密钥：仓库内置 src-tauri/keystore/release.p12（PKCS12）。
      # 原因：以前每次 CI 在全新 runner 上用 keytool 随机生成 debug keystore，
      # 导致每次发布 APK 签名不同 → 更新安装报"签名冲突"（INSTALL_FAILED_UPDATE_INCOMPATIBLE）。
      # 现在所有 Release 构建都用同一把 key 签名，更新可正常覆盖安装。
      # 注意：Debug 包（IS_DEBUG=true）仍走 Gradle 默认 debug keystore，仅供内部测试，
      #       与 Release 包签名不同，无法互相覆盖升级。
      - name: Sign APK with release keystore
        if: env.IS_DEBUG != 'true'
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: |
          KS="src-tauri/keystore/release.p12"
          [ -f "$KS" ] || { echo "!! 缺少固定签名密钥 $KS"; exit 1; }
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "Signing APK: $APK"
          "$ANDROID_HOME/build-tools/34.0.0/zipalign" -f 4 "$APK" "$APK.aligned"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" sign \
            --ks "$KS" --ks-type pkcs12 \
            --ks-pass pass:bili-live --key-pass pass:bili-live \
            --ks-key-alias bili \
            --out "$APK" "$APK.aligned"
          rm -f "$APK.aligned"
          echo "Signed APK ready: $APK"

      - name: Upload APK (debug)
        if: env.IS_DEBUG == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bili-live-android-debug
          path: |
            src-tauri/gen/android/app/build/outputs/apk/universal/debug/*.apk
            src-tauri/gen/android/app/build/outputs/apk/debug/*.apk

      - name: Upload APK (release)
        if: env.IS_DEBUG != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bili-live-android
          path: |
            src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk
            src-tauri/gen/android/app/build/outputs/apk/release/*.apk

  # ==================== iOS IPA ====================
  build-ipa:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, 'ipa')) }}
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,x86_64-apple-ios,aarch64-apple-ios-sim

      # 缓存 ~/.cargo registry 与 target，避免每次 run 重新下载全部 crate 并全量编译依赖
      # workspace 在 src-tauri/ 子目录，必须用 workspaces 显式指定；
      # 否则 rust-cache 只在仓库根找 Cargo.lock（找不到 → 空哈希 da39a3ee → 只存 1KB 空缓存，缓存形同虚设）
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri"

      - name: Install npm dependencies
        run: npm ci --fetch-retries=5 --fetch-retry-mintimeout=10000 --fetch-retry-maxtimeout=60000

      - name: Replace default icon with custom icon
        run: cp public/orig_icon.png app-icon.png

      - name: Init iOS project
        run: npx tauri ios init

      - name: Generate app icons for iOS
        run: npx tauri icon public/orig_icon.png

      - name: Configure iOS Info.plist permissions
        shell: bash
        run: |
          set -euo pipefail
          # 定位应用主 Info.plist：遍历 gen/ios 与 gen/apple，取 CFBundlePackageType=APPL（App）的那个
          APP_PLIST=""
          for plist in $(find src-tauri/gen/ios src-tauri/gen/apple -name "Info.plist" 2>/dev/null); do
            if /usr/libexec/PlistBuddy -c "Print :CFBundlePackageType" "$plist" 2>/dev/null | grep -q "APPL"; then
              APP_PLIST="$plist"
              break
            fi
          done
          if [ -z "$APP_PLIST" ]; then
            echo "!! 未找到应用 Info.plist (CFBundlePackageType=APPL)"
            echo "生成的 Info.plist 列表:"
            find src-tauri/gen/ios src-tauri/gen/apple -name "Info.plist" 2>/dev/null || true
            exit 1
          fi
          echo "Editing app Info.plist: $APP_PLIST"
          # 不存在才添加，避免重复 key 导致 PlistBuddy Add 报错
          add_key() {
            local key="$1" type="$2" value="$3"
            if /usr/libexec/PlistBuddy -c "Print :$key" "$APP_PLIST" >/dev/null 2>&1; then
              echo "Key $key already present, skip"
            else
              /usr/libexec/PlistBuddy -c "Add :$key $type $value" "$APP_PLIST"
              echo "Added $key"
            fi
          }
          # 保存图片到相册权限说明（pldownloader 必需，缺失会导致保存时崩溃）
          add_key "NSPhotoLibraryAddUsageDescription" "string" "需要访问相册以将你生成的图片保存到照片库"
          # 允许通过"文件"App 访问应用文档（便于导出 JSON 等）
          add_key "UIFileSharingEnabled" "bool" "true"
          add_key "LSSupportsOpeningDocumentsInPlace" "bool" "true"
          # 允许 WebView 加载明文 HTTP：复活曲截图页以 iframe 加载 http://<服务器>/screenshot，
          # iOS ATS 默认阻止 HTTP，必须放行 WKWebView 内的任意加载（只影响 Web 内容，不放开原生请求）。
          add_key "NSAppTransportSecurity" "dict" "{}"
          if /usr/libexec/PlistBuddy -c "Print :NSAppTransportSecurity:NSAllowsArbitraryLoadsInWebContent" "$APP_PLIST" >/dev/null 2>&1; then
            echo "NSAllowsArbitraryLoadsInWebContent already present, skip"
          else
            /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoadsInWebContent bool true" "$APP_PLIST"
            echo "Added NSAllowsArbitraryLoadsInWebContent=true"
          fi
          # 设置应用语言为中文（确保系统对话框、长按菜单等显示中文）
          /usr/libexec/PlistBuddy -c "Delete :CFBundleDevelopmentRegion" "$APP_PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleDevelopmentRegion string zh_CN" "$APP_PLIST"
          /usr/libexec/PlistBuddy -c "Delete :CFBundleLocalizations" "$APP_PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleLocalizations array" "$APP_PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleLocalizations:0 string zh_CN" "$APP_PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleLocalizations:1 string en" "$APP_PLIST"
          echo "Set locale: CFBundleDevelopmentRegion=zh_CN, CFBundleLocalizations=[zh_CN, en]"

      # 前端由 beforeBuildCommand（npm run build:tauri）在 tauri 构建时构建，服务器地址在步骤级提供
      - name: Build iOS IPA
        env:
          NEXT_PUBLIC_SERVER_URL: ${{ env.SERVER_URL }}
        run: |
          if [ "$IS_DEBUG" = "true" ]; then
            npx tauri ios build --target aarch64 --no-sign --debug
          else
            npx tauri ios build --target aarch64 --no-sign
          fi

      - name: Upload IPA (debug)
        if: env.IS_DEBUG == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bili-live-ios-debug
          path: |
            src-tauri/gen/apple/build/*/*.ipa
            src-tauri/gen/ios/build/*/*.ipa

      - name: Upload IPA (release)
        if: env.IS_DEBUG != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bili-live-ios
          path: |
            src-tauri/gen/apple/build/*/*.ipa
            src-tauri/gen/ios/build/*/*.ipa

  # ==================== 热更新包（前端资源 OTA） ====================
  # 构建前端 out/ 目录，用 tauri-plugin-hotswap 方案打包签名：
  #   frontend-<seq>.tar.gz（bundle）+ hotswap.json（manifest，含签名/sequence/min_binary_version）
  # 上传为 artifact，由 publish-artifacts 下载后发布到服务器 /artifacts/webapp/。
  # 触发条件：commit 含 "hot" 关键词，或任一原生客户端构建（exe/apk/ipa）同时触发。
  # 需在 GitHub Settings → Secrets 中配置：
  #   HOT_UPDATE_SIGN_KEY — base64 编码的 minisign 私钥（minisign -G 生成后 base64 编码）。
  #     无密码私钥即可（无需 HOT_UPDATE_KEY_PASSWORD）
  build-hot-update:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (contains(github.event.head_commit.message, 'hot') || contains(github.event.head_commit.message, 'exe') || contains(github.event.head_commit.message, 'apk') || contains(github.event.head_commit.message, 'ipa'))) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci --fetch-retries=5 --fetch-retry-mintimeout=10000 --fetch-retry-maxtimeout=60000

      - name: Resolve build timestamp
        id: ts
        run: |
          TS_RAW="$(curl -sS -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            | jq -r '.created_at' 2>/dev/null || true)"
          BUILD_TS="$(TZ=Asia/Shanghai date -d "${TS_RAW}" +%Y%m%d-%H%M%S 2>/dev/null || true)"
          if ! [[ "${BUILD_TS}" =~ ^[0-9]{8}-[0-9]{6}$ ]]; then
            BUILD_TS="$(TZ=Asia/Shanghai date +%Y%m%d-%H%M%S)"
          fi
          echo "BUILD_TS=${BUILD_TS}" >> "$GITHUB_OUTPUT"

      - name: Build frontend
        env:
          NEXT_PUBLIC_SERVER_URL: ${{ env.SERVER_URL }}
          NEXT_PUBLIC_BUILD_DATE: ${{ steps.ts.outputs.BUILD_TS }}
        run: npm run build:tauri

      - name: Check signing key
        env:
          HOT_UPDATE_SIGN_KEY: ${{ secrets.HOT_UPDATE_SIGN_KEY }}
        run: |
          if [ -z "$HOT_UPDATE_SIGN_KEY" ]; then
            echo "!! HOT_UPDATE_SIGN_KEY secret 未设置，跳过热更新签名"
            echo "HAS_KEY=false" >> "$GITHUB_ENV"
          else
            echo "HAS_KEY=true" >> "$GITHUB_ENV"
          fi

      - name: Sign hot update bundle
        if: env.HAS_KEY == 'true'
        env:
          HOT_UPDATE_SIGN_KEY: ${{ secrets.HOT_UPDATE_SIGN_KEY }}
          # 构建时间戳（YYYYMMDD-HHMMSS），拼进热更新显示版本号
          BUILD_TS: ${{ steps.ts.outputs.BUILD_TS }}
        run: |
          set -e
          mkdir -p hot-update-release
          # 原生版本号（tauri.conf.json 的 version）：
          #   - 作为 manifest.min_binary_version（最低兼容原生版本）。
          #     热更新包基于本次源码构建，前端可能依赖新 Rust 命令/插件，
          #     所以只对"原生版本 ≥ 本次版本"的 APP 生效。
          #   - 拼进显示版本 version。
          NATIVE_VERSION=$(grep -E '"version"\s*:' src-tauri/tauri.conf.json | head -1 | sed -E 's/.*"version"\s*:\s*"([^"]+)".*/\1/')
          # sequence：单调递增计数器（hotswap 唯一排序依据，version 仅显示用）。
          # 用 github.run_number（本 workflow 每次运行递增）即可。
          SEQUENCE=${{ github.run_number }}
          echo "sequence=${SEQUENCE}  min_binary_version=${NATIVE_VERSION}"
          # 1) 归档 out/ 为 tar.gz：根目录必须直接含 index.html（用 -C out .）
          tar -czf hot-update-release/frontend-${SEQUENCE}.tar.gz -C out .
          # 2) 用 minisign 私钥签名 → frontend-${SEQUENCE}.tar.gz.sig
          #    注意 tauri-cli signer sign 的 -k 接收的是"base64 编码的 minisign secret key box"，
          #    不是文件路径（读文件用 -f，也不接受明文 box）。
          #    HOT_UPDATE_SIGN_KEY = base64(整个 hot-update.key 文件)，恰好就是这个格式，
          #    所以直接传给 -k，无需先 base64 -d。
          #    -p "" 必须带：minisign -G 空密码生成的密钥在 minisign-rs 里仍标记为"加密"，
          #    不带 -p 会走交互式密码提示，而 GitHub Actions 没有 stdin，会永久挂起。
          npx @tauri-apps/cli signer sign hot-update-release/frontend-${SEQUENCE}.tar.gz -k "$HOT_UPDATE_SIGN_KEY" -p ""
          # 3) 生成 hotswap.json manifest：
          #    signature        = .sig 文件全文。tauri signer sign 写入的是
          #                      base64(签名文本)，hotswap 插件 verify_signature 会先
          #                      base64 解码再验（也兼容"untrusted comment:"开头的原文）
          #    url              = bundle 的绝对 HTTPS 地址（插件 require_https 强制校验非 HTTPS 拒绝）
          #    min_binary_version = 本次原生版本（semver，插件在 download 阶段客户端强制校验）
          #    bundle_size      = bundle 字节数（供前端按流量提示）
          SIGNATURE=$(cat hot-update-release/frontend-${SEQUENCE}.tar.gz.sig)
          SIZE=$(stat -c%s hot-update-release/frontend-${SEQUENCE}.tar.gz)
          # version：仅显示用（插件排序只看 sequence）。格式符合 semver：
          #   MAJOR.MINOR.PATCH-YYYYMMDD.HHMMSS（时间戳中 '-' 需替换为 '.'，
          #   否则 prerelease 段含 '-' 不合法，hot-update-sign 会报错）。
          # 前端显示时解析为 "V1.3.4-20260819"（见 updater.ts formatHotUpdateVersion）。
          VERSION_TS="${BUILD_TS//-/.}"
          jq -n \
            --arg version "${NATIVE_VERSION}-${VERSION_TS}" \
            --argjson sequence "${SEQUENCE}" \
            --arg min_binary_version "${NATIVE_VERSION}" \
            --arg url "${{ env.SERVER_URL }}/artifacts/webapp/frontend-${SEQUENCE}.tar.gz" \
            --arg signature "${SIGNATURE}" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson bundle_size "${SIZE}" \
            '{version:$version, sequence:$sequence, min_binary_version:$min_binary_version, url:$url, signature:$signature, pub_date:$pub_date, bundle_size:$bundle_size}' \
            > hot-update-release/hotswap.json
          # 签名已内嵌进 manifest，无需单独分发 .sig 文件
          rm hot-update-release/frontend-${SEQUENCE}.tar.gz.sig
          echo "热更新产物："
          ls -la hot-update-release/
          echo "hotswap.json:"
          cat hot-update-release/hotswap.json

      - name: Upload hot update bundle
        if: env.HAS_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bili-live-hot-update
          path: hot-update-release/

  # ==================== 发布客户端产物到服务器 ====================
  # 将 exe/apk/ipa 三种平台产物按构建时间打包发布到服务器：
  #   ${TARGET_DIR}/artifacts/release-<版本>-<构建时间戳>/  -> 本次 run 的所有平台产物（归组）
  #   ${TARGET_DIR}/artifacts/current_exe            -> 指向最新 exe
  #   ${TARGET_DIR}/artifacts/current_apk            -> 指向最新 apk
  #   ${TARGET_DIR}/artifacts/current_ipa            -> 指向最新 ipa
  #   ${TARGET_DIR}/artifacts/versions.json          -> 每平台版本号+构建日期（供 landing 页角标 + App 内更新检查）
  # release 目录名带版本号：versions.json 按平台解析各自 current_* 实际指向的目录，
  # 未构建的平台保留旧版本号+旧日期，保证"显示的版本号"与"实际安装包"一一对应。
  # 构建时间戳取本次 workflow run 的 created_at（同一 run 内所有作业共享同一值），
  # 与 deploy-server 的 .releases 原子版本管理同一模式；旧版本只保留最近 5 个。
  publish-artifacts:
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'exe') || contains(github.event.head_commit.message, 'apk') || contains(github.event.head_commit.message, 'ipa') || contains(github.event.head_commit.message, 'hot')) }}
    needs: [build-exe, build-apk, build-ipa, build-hot-update]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo for version reading
        uses: actions/checkout@v4

      - name: Download all client artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "bili-live-*"
          path: artifacts-dl
          if-no-files-found: ignore
        continue-on-error: true

      - name: Verify downloaded artifacts
        run: |
          echo "artifacts-dl 目录内容:"
          ls -la artifacts-dl/ 2>/dev/null || echo "(目录不存在或为空)"
          find artifacts-dl -maxdepth 2 -type d 2>/dev/null || true

      - name: Resolve build timestamp
        id: ts
        run: |
          TS_RAW="$(curl -sS -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            | jq -r '.created_at' 2>/dev/null || true)"
          # created_at 为 UTC（如 2026-08-15T03:46:59Z），转成东八区（Asia/Shanghai）：
          # 本地 0-8 点构建时 UTC 日期仍是前一天，若不转换，目录名/landing 日期会落后一天。
          BUILD_TS="$(TZ=Asia/Shanghai date -d "${TS_RAW}" +%Y%m%d-%H%M%S 2>/dev/null || true)"
          # 必须校验为合法时间戳（YYYYMMDD-HHMMSS）。
          # 注意：API 失败时 jq -r '.created_at' 会输出字面字符串 "null"（非空），
          # 此时 date -d 解析失败、BUILD_TS 为空，落到下面的东八区当前时间兜底。
          if ! [[ "${BUILD_TS}" =~ ^[0-9]{8}-[0-9]{6}$ ]]; then
            BUILD_TS="$(TZ=Asia/Shanghai date +%Y%m%d-%H%M%S)"
          fi
          echo "BUILD_TS=${BUILD_TS}"
          echo "BUILD_TS=${BUILD_TS}" >> "$GITHUB_OUTPUT"

      - name: Prepare publish files
        id: prepare
        env:
          HOT_UPDATE_SIGN_KEY: ${{ secrets.HOT_UPDATE_SIGN_KEY }}
        run: |
          set -e
          mkdir -p publish
          #
          # 选择规则（同平台多文件混进 artifacts-dl 时只保留正确的一个）：
          #   1. 优先 release 包（路径含 /release/ 或文件名含 release），
          #      没有 release 才退到 debug（路径含 /debug/ 或文件名含 debug）。
          #      这是最关键的一层，避免 publish-artifacts 从 Actions 仓库下载到
          #      上一次 debug 构建留下的同名 artifact（workflow run 间会残留），
          #      导致 current_apk 指向 debug、一个 release-目录里混进两个 APK。
          #   2. APK 额外优先 universal 变体（避免同时存在通用包/特定 ABI 包时选错）。
          #
          pick_first() {
            # stdin 为候选路径列表（每行一个）；输出第一个非空的，空则输出空
            while IFS= read -r line; do
              [ -n "${line}" ] && [ -f "${line}" ] && { echo "${line}"; return 0; }
            done
            return 1
          }
          # EXE：先 release，再 debug
          EXE_CANDIDATES() {
            find artifacts-dl -type f -name '*.exe' | grep -E '/release/|release[^/]*\.exe$' || true
            find artifacts-dl -type f -name '*.exe' | grep -vE '/debug/|debug[^/]*\.exe$' || true
            find artifacts-dl -type f -name '*.exe' || true
          }
          EXE="$(EXE_CANDIDATES | awk '!seen[$0]++' | pick_first || true)"
          # APK：先 universal+release，再 universal(任意)，再 release，最后任意
          APK_CANDIDATES() {
            find artifacts-dl -type f -name '*.apk' | grep universal | grep -E '/release/|release[^/]*\.apk$' || true
            find artifacts-dl -type f -name '*.apk' | grep universal || true
            find artifacts-dl -type f -name '*.apk' | grep -E '/release/|release[^/]*\.apk$' || true
            find artifacts-dl -type f -name '*.apk' || true
          }
          APK="$(APK_CANDIDATES | awk '!seen[$0]++' | pick_first || true)"
          # IPA：先 release，再 debug
          IPA_CANDIDATES() {
            find artifacts-dl -type f -name '*.ipa' | grep -E '/release/|release[^/]*\.ipa$' || true
            find artifacts-dl -type f -name '*.ipa' | grep -vE '/debug/|debug[^/]*\.ipa$' || true
            find artifacts-dl -type f -name '*.ipa' || true
          }
          IPA="$(IPA_CANDIDATES | awk '!seen[$0]++' | pick_first || true)"
          # 统一安装包文件名：release → B瓜.<ext>，debug → B瓜-debug.<ext>
          # 依据实际选中的文件判断构建类型：路径/文件名含 debug 即 debug 包，否则为 release
          package_name() {
            local src="$1" ext="$2"
            if printf '%s' "${src}" | grep -qi 'debug'; then
              echo "B瓜-debug.${ext}"
            else
              echo "B瓜.${ext}"
            fi
          }
          if [ -n "${EXE}" ]; then echo "EXE 选中: ${EXE}"; cp "${EXE}" "publish/$(package_name "${EXE}" exe)"; fi
          if [ -n "${APK}" ]; then echo "APK 选中: ${APK}"; cp "${APK}" "publish/$(package_name "${APK}" apk)"; fi
          if [ -n "${IPA}" ]; then echo "IPA 选中: ${IPA}"; cp "${IPA}" "publish/$(package_name "${IPA}" ipa)"; fi
          # 热更新包（hotswap.json + frontend-<seq>.tar.gz）
          if [ -d "artifacts-dl/bili-live-hot-update" ]; then
            mkdir -p publish/webapp
            cp -a artifacts-dl/bili-live-hot-update/. publish/webapp/
            echo "热更新包已加入 publish/webapp/"
            ls -la publish/webapp/
          else
            echo "无热更新包（HOT_UPDATE_SIGN_KEY 未配置或本次未构建）"
          fi
          # 读取原生版本号（tauri.conf.json 的 version 字段）
          APP_VERSION="$(jq -r '.version' src-tauri/tauri.conf.json 2>/dev/null || echo '')"
          echo "APP_VERSION=${APP_VERSION}" >> "$GITHUB_ENV"
          echo "发布文件:"
          ls -la publish/
          echo "HAS_FILES=$([ -n "$(ls -A publish 2>/dev/null)" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Upload artifacts to server (staging)
        id: scp-artifacts
        if: steps.prepare.outputs.HAS_FILES == 'true'
        uses: appleboy/scp-action@v0.1.7
        continue-on-error: true
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: publish/*
          # 每次 run 用独立的 staging 目录（BUILD_TS 唯一）：
          # scp-action 只增量覆盖、不清理目标目录，固定目录会让上一次 run 的
          # 旧产物残留在服务器 /tmp 里，被后续 release 目录 cp -a 带入，
          # 导致"未构建的平台"被误判为已构建（current_* 指向含旧包的目录），
          # versions.json 上报新版本号但实际下载的是旧包（iOS 死循环更新的根源）。
          target: /tmp/bili_live-artifacts-${{ steps.ts.outputs.BUILD_TS }}
          overwrite: true
          strip_components: 1
          timeout: 120s
          command_timeout: 120s

      - name: Retry upload artifacts (wait 15s)
        if: steps.prepare.outputs.HAS_FILES == 'true' && steps.scp-artifacts.outcome == 'failure'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: publish/*
          target: /tmp/bili_live-artifacts-${{ steps.ts.outputs.BUILD_TS }}
          overwrite: true
          strip_components: 1
          timeout: 120s
          command_timeout: 120s

      - name: Atomic publish on server
        id: ssh-publish
        if: steps.prepare.outputs.HAS_FILES == 'true'
        uses: appleboy/ssh-action@v1.0.3
        continue-on-error: true
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 10m
          script: |
            set -e
            TARGET_DIR="${{ secrets.SSH_TARGET_DIR }}"
            ARTIFACTS_DIR="${TARGET_DIR}/artifacts"
            APP_VERSION="${{ env.APP_VERSION }}"
            # 本次 run 的独立 staging 目录（与 scp target 一致）：避免旧 run 残留产物污染
            STAGING_DIR="/tmp/bili_live-artifacts-${{ steps.ts.outputs.BUILD_TS }}"
            # release 目录名带版本号：release-<版本>-<日期>-<时间>
            # 版本号+日期都从目录名解析（见下方 extract_meta），保证 versions.json 里
            # 每平台版本号与它实际指向的安装包一一对应。
            RELEASE_DIR="${ARTIFACTS_DIR}/release-${APP_VERSION}-${{ steps.ts.outputs.BUILD_TS }}"
            mkdir -p "${ARTIFACTS_DIR}" "${RELEASE_DIR}"
            cp -a "${STAGING_DIR}/." "${RELEASE_DIR}/"
            # ==================== 热更新包发布到 webapp 目录 ====================
            # hotswap.json（manifest）+ frontend-<seq>.tar.gz（bundle）
            # 客户端从 ${ARTIFACTS_DIR}/webapp/hotswap.json 拉取热更新清单
            if [ -d "${RELEASE_DIR}/webapp" ]; then
              mkdir -p "${ARTIFACTS_DIR}/webapp"
              cp -a "${RELEASE_DIR}/webapp/." "${ARTIFACTS_DIR}/webapp/"
              echo "热更新包已发布到 webapp/"
              ls -la "${ARTIFACTS_DIR}/webapp/"
            fi
            # ==================== 选包工具函数：release 优先，debug 兜底 ====================
            # 防止 release 目录混进 debug 包时 current_* 指向错误版本。
            # 选择顺序（同平台多文件时只返回第一个命中）：
            #   1. 文件名含 release（优先级最高）
            #   2. 文件名不含 debug（中性兜底，通常就是 release）
            #   3. 任意文件（纯 debug 场景兜底）
            pick_release() {
              local dir="$1" ext="$2"
              [ -d "$dir" ] || return 1
              local f
              # 1) release 关键字
              for f in "$dir"/*release*"$ext"; do [ -f "$f" ] && { echo "$f"; return 0; }; done
              # 2) 不含 debug 关键字
              for f in "$dir"/*"$ext"; do
                [ -f "$f" ] || continue
                case "$(basename "$f")" in *debug*|*DEBUG*) continue;; *) echo "$f"; return 0;; esac
              done
              # 3) 兜底任意
              for f in "$dir"/*"$ext"; do [ -f "$f" ] && { echo "$f"; return 0; }; done
              return 1
            }
            # 更新各平台 current 链接（仅当本次含该平台产物时更新，其余保持指向旧版）
            PICKED_EXE="$(pick_release "${RELEASE_DIR}" ".exe" || true)"
            PICKED_APK="$(pick_release "${RELEASE_DIR}" ".apk" || true)"
            PICKED_IPA="$(pick_release "${RELEASE_DIR}" ".ipa" || true)"
            if [ -n "${PICKED_EXE}" ]; then
              echo "EXE 选中 -> ${PICKED_EXE}"
              ln -sfn "${PICKED_EXE}" "${ARTIFACTS_DIR}/current_exe"
            fi
            if [ -n "${PICKED_APK}" ]; then
              echo "APK 选中 -> ${PICKED_APK}"
              ln -sfn "${PICKED_APK}" "${ARTIFACTS_DIR}/current_apk"
            fi
            if [ -n "${PICKED_IPA}" ]; then
              echo "IPA 选中 -> ${PICKED_IPA}"
              ln -sfn "${PICKED_IPA}" "${ARTIFACTS_DIR}/current_ipa"
            fi

            # ---- 生成各平台当前版本+日期 versions.json（供 landing 页显示 + App 内更新检查）----
            # 版本号和日期都从 current_* 链接指向的实际安装包所在 release-<版本>-<日期>-<时间>
            # 目录名中提取。每次发布都从 current 链接实时解析，因此本次未构建的平台
            # 会保留旧版本号+旧日期，与其实际指向的安装包一一对应，避免"版本号与包不一致"。
            extract_meta() {
              local link="$1"
              local target rel ver rest
              target="$(readlink -f "${link}" 2>/dev/null || true)"
              [ -z "${target}" ] && return 1
              rel="${target#*release-}"
              ver="${rel%%-*}"
              rest="${rel#*-}"
              case "${rest}" in
                [0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]-[0-9][0-9][0-9][0-9][0-9][0-9]*)
                  echo "${ver}|${rest:0:4}-${rest:4:2}-${rest:6:2}"
                  return 0
                  ;;
              esac
              return 1
            }
            W_META="$(extract_meta "${ARTIFACTS_DIR}/current_exe")" || true
            A_META="$(extract_meta "${ARTIFACTS_DIR}/current_apk")" || true
            I_META="$(extract_meta "${ARTIFACTS_DIR}/current_ipa")" || true
            W_VER="${W_META%%|*}"; W_DATE="${W_META#*|}"
            A_VER="${A_META%%|*}"; A_DATE="${A_META#*|}"
            I_VER="${I_META%%|*}"; I_DATE="${I_META#*|}"
            # version 对象独立构建（避免尾逗号）：仅写入有版本号的平台
            VER_OBJ=""
            VSEP=""
            add_ver_p() {
              local key="$1" val="$2"
              [ -z "${val}" ] && return 0
              VER_OBJ="${VER_OBJ}${VSEP}    \"${key}\": \"${val}\""
              VSEP=",\n"
            }
            add_ver_p "windows" "${W_VER}"
            add_ver_p "android" "${A_VER}"
            add_ver_p "ios" "${I_VER}"
            # versions.json：version 每平台对象 + 顶层各平台日期 + downloads（相对路径）
            VJSON="{\n"
            VJSON="${VJSON}  \"version\": {\n"
            if [ -n "${VER_OBJ}" ]; then
              VJSON="${VJSON}${VER_OBJ}\n"
            fi
            VJSON="${VJSON}  }\n"
            VSEP=",\n"
            add_ver() {
              local key="$1" val="$2"
              [ -z "${val}" ] && return 0
              VJSON="${VJSON}${VSEP}  \"${key}\": \"${val}\""
              VSEP=",\n"
            }
            add_ver "windows" "${W_DATE}"
            add_ver "android" "${A_DATE}"
            add_ver "ios" "${I_DATE}"
            # 下载地址（相对路径，客户端用 serverApiUrl 补全服务器地址）
            VJSON="${VJSON}${VSEP}  \"downloads\": {\n"
            VSEP=""
            add_dl() {
              local key="$1" link="$2"
              [ -L "${ARTIFACTS_DIR}/${link}" ] || return 0
              VJSON="${VJSON}${VSEP}    \"${key}\": \"/artifacts/${link}\""
              VSEP=",\n"
            }
            add_dl "windows" "current_exe"
            add_dl "android" "current_apk"
            add_dl "ios" "current_ipa"
            VJSON="${VJSON}\n  }\n"
            VJSON="${VJSON}}\n"
            printf '%b' "${VJSON}" > "${ARTIFACTS_DIR}/versions.json"
            echo "versions.json:"
            cat "${ARTIFACTS_DIR}/versions.json"

            echo "发布完成 -> ${RELEASE_DIR}"
            ls -la "${RELEASE_DIR}"
            echo "artifacts 目录:"
            ls -la "${ARTIFACTS_DIR}"
            # 清理旧版本，保留最近 5 个，但不能删 current_* 链接指向的 release 目录。
            # 场景：某次只构建 exe 没构建 apk，current_apk 仍指向旧 release，
            # 若该 release 因排序落在 6 名以后被清理，链接就断了。
            PROTECTED=""
            for link in current_exe current_apk current_ipa; do
              target="$(readlink "${ARTIFACTS_DIR}/${link}" 2>/dev/null || true)"
              [ -n "$target" ] && PROTECTED="${PROTECTED} ${target%/*}"
            done
            # 同时保护 webapp 目录不被清理
            PROTECTED="${PROTECTED} ${ARTIFACTS_DIR}/webapp"
            ls -1dt "${ARTIFACTS_DIR}"/release-* 2>/dev/null | tail -n +6 | while IFS= read -r dir; do
              case "${PROTECTED}" in
                *"${dir}"*) echo "保留（current 链接指向）: ${dir}"; continue ;;
              esac
              rm -rf "${dir}"
            done

      - name: Retry atomic publish (wait 15s)
        if: steps.prepare.outputs.HAS_FILES == 'true' && steps.ssh-publish.outcome == 'failure'
        uses: appleboy/ssh-action@v1.0.3
