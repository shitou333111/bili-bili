name: Deploy & Build

on:
  push:
    branches: [ main, native-client ]
  workflow_dispatch:
    inputs:
      server_url:
        description: "服务器地址（留空则使用 Secrets 中的 NEXT_PUBLIC_SERVER_URL；可手动填入本地地址用于本地测试）"
        required: false
        type: string
        default: ""
      debug:
        description: "打包 Debug 版本（不勾选则默认 Release）"
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-build-${{ github.ref }}
  cancel-in-progress: false

# ==================== 构建触发逻辑 ====================
# 通过 commit 关键词触发不同作业：
#   server -> 部署服务器（SSH 上传 + pm2 重启）
#   exe    -> Windows EXE
#   apk    -> Android APK
#   ipa    -> iOS IPA
# 例如 "exe apk" 会同时构建 EXE 和 APK。
# 关键词 "debug" 使所有客户端构建使用 Debug 包（对 server 部署无影响）。
#
# 服务器地址优先级（仅客户端构建用）：
#   1. commit 含 "local" 关键字 → 强制使用 http://192.168.1.2:3000（本地开发）
#   2. workflow_dispatch 时手动输入的 server_url
#   3. GitHub Secrets 中的 NEXT_PUBLIC_SERVER_URL
#   4. 默认值 http://192.168.1.2:3000（本地测试用）
# 请在 GitHub Settings → Secrets and variables → Actions 中配置 NEXT_PUBLIC_SERVER_URL

env:
  SERVER_URL: ${{ (github.event_name == 'push' && contains(github.event.head_commit.message, 'local')) && 'http://192.168.1.2:3000' || inputs.server_url || secrets.NEXT_PUBLIC_SERVER_URL || 'http://192.168.1.2:3000' }}
  # commit message 含 debug 或手动勾选 debug → true（Debug 包），否则 false（Release 包）
  IS_DEBUG: ${{ (github.event_name == 'workflow_dispatch' && inputs.debug == true) || (github.event_name == 'push' && contains(github.event.head_commit.message, 'debug')) }}

jobs:
  # ==================== 服务器部署 ====================
  deploy-server:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, 'server'))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Prepare deploy artifacts
        run: |
          # Next.js standalone 输出结构:
          # .next/standalone/  -> Node.js 服务端代码 + node_modules
          # .next/static/      -> 静态资源 (JS/CSS/图片)
          # public/            -> 公共静态文件

          mkdir -p deploy-dist

          # 复制 standalone 服务端
          cp -r .next/standalone/. deploy-dist/

          # 复制静态资源到 standalone 目录内
          mkdir -p deploy-dist/.next/static
          cp -r .next/static/. deploy-dist/.next/static/

          # 关键：Next.js 16 + Turbopack 的 standalone 产物缺少 .next/server/chunks
          # （SSR chunks），server.js 运行时 require 不到会全站 500（Cannot find module）。
          # 从完整构建输出补入，修复部署后无法加载 SSR chunk 的问题。
          mkdir -p deploy-dist/.next/server
          cp -r .next/server/chunks deploy-dist/.next/server/chunks

          # 复制 public 目录
          if [ -d public ]; then
            cp -r public/. deploy-dist/public/
          fi

      - name: Upload dist to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: deploy-dist/*
          target: /tmp/bili_live-deploy
          overwrite: true
          strip_components: 1

      # 在 runner 上解析版本名（GITHUB_RUN_ID/ATTEMPT 只存在于 runner，
      # 不能直接在 ssh 脚本里用 ${GITHUB_RUN_ID}，否则到服务器上被展开为空值，
      # 导致所有版本都落到 release-- 目录，原子版本管理失效）
      - name: Resolve release name
        id: release-name
        run: echo "RELEASE_NAME=release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Atomic deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 30m
          script: |
            set -e
            TARGET_DIR="${{ secrets.SSH_TARGET_DIR }}"
            RELEASES_DIR="${TARGET_DIR}/.releases"
            RELEASE_DIR="${RELEASES_DIR}/${{ steps.release-name.outputs.RELEASE_NAME }}"
            CURRENT_DIR="${TARGET_DIR}/current"
            PRESERVE_DIR="${TARGET_DIR}/preserved"
            LAST_RELEASE="$(ls -1dt "${RELEASES_DIR}"/release-* 2>/dev/null | head -n 1 || true)"

            mkdir -p "${PRESERVE_DIR}"

            # Bootstrap preserved data from current or latest release.
            # .data/ 目录存储用户记录、盲盒数据、admin配置等，必须跨版本保留
            if [ ! -d "${PRESERVE_DIR}/.data" ]; then
              if [ -d "${CURRENT_DIR}/.data" ]; then
                cp -a "${CURRENT_DIR}/.data" "${PRESERVE_DIR}/.data"
              elif [ -n "${LAST_RELEASE}" ] && [ -d "${LAST_RELEASE}/.data" ]; then
                cp -a "${LAST_RELEASE}/.data" "${PRESERVE_DIR}/.data"
              else
                mkdir -p "${PRESERVE_DIR}/.data"
              fi
            fi

            # 创建新版本目录
            mkdir -p "$RELEASE_DIR"
            cp -a /tmp/bili_live-deploy/. "$RELEASE_DIR/"

            # 用符号链接挂载持久化数据目录
            rm -rf "${RELEASE_DIR:?}/.data"
            ln -sfn "${PRESERVE_DIR}/.data" "${RELEASE_DIR}/.data"

            # 原子切换 current 指针
            ln -sfn "$RELEASE_DIR" "${TARGET_DIR}/current"

            # 启动/重启服务
            if command -v pm2 >/dev/null 2>&1; then
              # 关键：必须 delete 后重新 start，不能直接 restart！
              # pm2 会把启动时 server.js 的符号链接解析成真实路径并缓存（pm_exec_path），
              # restart 沿用缓存的旧路径执行，即使 current 已切换到新版本仍跑旧代码，导致页面不更新。
              # delete 后以当前 current 目录重新 start，让 pm2 重新解析到最新版本路径。
              pm2 delete bili-live >/dev/null 2>&1 || true
              cd "${TARGET_DIR}/current"
              HOST=127.0.0.1 PORT=3000 pm2 start server.js --name bili-live
              pm2 save || true
            else
              PID_FILE="${TARGET_DIR}/server.pid"
              if [ -f "${PID_FILE}" ]; then
                OLD_PID="$(cat "${PID_FILE}" 2>/dev/null || true)"
                if [ -n "${OLD_PID}" ] && kill -0 "${OLD_PID}" 2>/dev/null; then
                  kill "${OLD_PID}" || true
                fi
                rm -f "${PID_FILE}"
              fi

              cd "${TARGET_DIR}/current"
              HOST=127.0.0.1 PORT=3000 nohup node server.js > "${TARGET_DIR}/server.log" 2>&1 &
              echo $! > "${PID_FILE}"
            fi

            # 清理旧版本，保留最近 5 个
            ls -1dt "${RELEASES_DIR}"/release-* 2>/dev/null | tail -n +6 | xargs -r rm -rf

  # ==================== Windows EXE ====================
  build-exe:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, 'exe')) }}
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      # 缓存 ~/.cargo registry 与 target，避免每次 run 重新下载全部 crate 并全量编译依赖
      # workspace 在 src-tauri/ 子目录，必须用 workspaces 显式指定；
      # 否则 rust-cache 只在仓库根找 Cargo.lock（找不到 → 空哈希 da39a3ee → 只存 1KB 空缓存，缓存形同虚设）
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri"

      - name: Install npm dependencies
        run: npm ci --fetch-retries=5 --fetch-retry-mintimeout=10000 --fetch-retry-maxtimeout=60000

      # 前端由 beforeBuildCommand（npm run build:tauri）在 tauri 构建时构建，服务器地址在步骤级提供
      - name: Build Windows EXE
        env:
          NEXT_PUBLIC_SERVER_URL: ${{ env.SERVER_URL }}
        shell: bash
        run: |
          if [ "$IS_DEBUG" = "true" ]; then
            npx tauri build --no-bundle --debug
          else
            npx tauri build --no-bundle
          fi

      - name: Upload EXE (debug)
        if: env.IS_DEBUG == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bili-live-exe-debug
          path: src-tauri/target/debug/*.exe

      - name: Upload EXE (release)
        if: env.IS_DEBUG != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bili-live-exe
          path: src-tauri/target/release/*.exe

  # ==================== Android APK ====================
  build-apk:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, 'apk')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0 ndk;27.0.12077973"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      # 缓存 ~/.cargo registry 与 target，避免每次 run 重新下载全部 crate 并全量编译依赖
      # workspace 在 src-tauri/ 子目录，必须用 workspaces 显式指定；
      # 否则 rust-cache 只在仓库根找 Cargo.lock（找不到 → 空哈希 da39a3ee → 只存 1KB 空缓存，缓存形同虚设）
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Install npm dependencies
        run: npm ci --fetch-retries=5 --fetch-retry-mintimeout=10000 --fetch-retry-maxtimeout=60000

      - name: Replace default icon with custom icon
        run: cp public/orig_icon.png app-icon.png

      - name: Init Android project
        run: npx tauri android init

      - name: Generate app icons for Android
        run: npx tauri icon public/orig_icon.png

      # ==================== 多窗口 Activity（Android 官方 multi-window 方案）====================
      # Tauri 官方多窗口（https://v2.tauri.app/learn/mobile-multiwindow/）：每个 WebviewWindow
      # 对应一个独立 Android Activity，通过 WebviewWindowBuilder::activity_name() 指定类名。
      # 这里在 tauri android init 生成的项目里注入两个面板 Activity（模拟活动页 / 黑抽页），
      # 并在 AndroidManifest.xml 注册。
      # 包名从 MainActivity.kt 动态推导（tauri 会把 identifier 中的 '-' 转成 '_'，不硬编码）。
      - name: Inject multi-window Activities (Android)
        shell: bash
        run: |
          set -euo pipefail
          MAIN_KT="$(find src-tauri/gen/android/app/src/main/java -name 'MainActivity.kt' | head -n 1)"
          [ -n "$MAIN_KT" ] || { echo "!! 找不到 MainActivity.kt"; exit 1; }
          PKG_DIR="$(dirname "$MAIN_KT")"
          echo "包目录: $PKG_DIR"
          PKG_LINE="$(grep -m1 '^package ' "$MAIN_KT")"
          [ -n "$PKG_LINE" ] || { echo "!! 无法从 MainActivity.kt 读取 package"; exit 1; }

          cat > "$PKG_DIR/ActivityPanelActivity.kt" <<EOF
          $PKG_LINE

          import android.os.Bundle

          class ActivityPanelActivity : TauriActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
              }
          }
          EOF

          cat > "$PKG_DIR/RealActivityPanelActivity.kt" <<EOF
          $PKG_LINE

          import android.os.Bundle

          class RealActivityPanelActivity : TauriActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
              }
          }
          EOF

          MANIFEST="src-tauri/gen/android/app/src/main/AndroidManifest.xml"
          if ! grep -q 'ActivityPanelActivity' "$MANIFEST"; then
            sed -i 's#</application>#\n    <activity android:name=".ActivityPanelActivity" android:exported="false" android:configChanges="orientation|keyboardHidden|keyboard|screenSize|locale|smallestScreenSize|screenLayout|uiMode" android:hardwareAccelerated="true" />\n    <activity android:name=".RealActivityPanelActivity" android:exported="false" android:configChanges="orientation|keyboardHidden|keyboard|screenSize|locale|smallestScreenSize|screenLayout|uiMode" android:hardwareAccelerated="true" />\n  </application>#' "$MANIFEST"
          fi
          echo "--- 注册的 Activity ---"
          grep -n 'activity android:name' "$MANIFEST"
          echo "--- 新增 Kotlin 文件 ---"
          ls -la "$PKG_DIR"

      # 前端由 beforeBuildCommand（npm run build:tauri）在 tauri 构建时构建，服务器地址在步骤级提供
      - name: Build Android APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
          JAVA_HOME: ${{ env.JAVA_HOME }}
          NEXT_PUBLIC_SERVER_URL: ${{ env.SERVER_URL }}
        run: |
          if [ "$IS_DEBUG" = "true" ]; then
            npx tauri android build --target aarch64 --debug
          else
            npx tauri android build --target aarch64
          fi

      # Debug 包已用 debug keystore 自动签名；仅 Release 包需要手动签名
      - name: Sign APK with debug keystore
        if: env.IS_DEBUG != 'true'
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: |
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            mkdir -p "$HOME/.android"
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "Signing APK: $APK"
          "$ANDROID_HOME/build-tools/34.0.0/zipalign" -f 4 "$APK" "$APK.aligned"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" sign \
            --ks "$HOME/.android/debug.keystore" \
            --ks-pass pass:android --key-pass pass:android \
            --ks-key-alias androiddebugkey \
            --out "$APK" "$APK.aligned"
          rm -f "$APK.aligned"
          echo "Signed APK ready: $APK"

      - name: Upload APK (debug)
        if: env.IS_DEBUG == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bili-live-android-debug
          path: |
            src-tauri/gen/android/app/build/outputs/apk/universal/debug/*.apk
            src-tauri/gen/android/app/build/outputs/apk/debug/*.apk

      - name: Upload APK (release)
        if: env.IS_DEBUG != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bili-live-android
          path: |
            src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk
            src-tauri/gen/android/app/build/outputs/apk/release/*.apk

  # ==================== iOS IPA ====================
  build-ipa:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, 'ipa')) }}
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,x86_64-apple-ios,aarch64-apple-ios-sim

      # 缓存 ~/.cargo registry 与 target，避免每次 run 重新下载全部 crate 并全量编译依赖
      # workspace 在 src-tauri/ 子目录，必须用 workspaces 显式指定；
      # 否则 rust-cache 只在仓库根找 Cargo.lock（找不到 → 空哈希 da39a3ee → 只存 1KB 空缓存，缓存形同虚设）
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri"

      - name: Install npm dependencies
        run: npm ci --fetch-retries=5 --fetch-retry-mintimeout=10000 --fetch-retry-maxtimeout=60000

      - name: Replace default icon with custom icon
        run: cp public/orig_icon.png app-icon.png

      - name: Init iOS project
        run: npx tauri ios init

      - name: Generate app icons for iOS
        run: npx tauri icon public/orig_icon.png

      - name: Configure iOS Info.plist permissions
        shell: bash
        run: |
          set -euo pipefail
          # 定位应用主 Info.plist：遍历 gen/ios 与 gen/apple，取 CFBundlePackageType=APPL（App）的那个
          APP_PLIST=""
          for plist in $(find src-tauri/gen/ios src-tauri/gen/apple -name "Info.plist" 2>/dev/null); do
            if /usr/libexec/PlistBuddy -c "Print :CFBundlePackageType" "$plist" 2>/dev/null | grep -q "APPL"; then
              APP_PLIST="$plist"
              break
            fi
          done
          if [ -z "$APP_PLIST" ]; then
            echo "!! 未找到应用 Info.plist (CFBundlePackageType=APPL)"
            echo "生成的 Info.plist 列表:"
            find src-tauri/gen/ios src-tauri/gen/apple -name "Info.plist" 2>/dev/null || true
            exit 1
          fi
          echo "Editing app Info.plist: $APP_PLIST"
          # 不存在才添加，避免重复 key 导致 PlistBuddy Add 报错
          add_key() {
            local key="$1" type="$2" value="$3"
            if /usr/libexec/PlistBuddy -c "Print :$key" "$APP_PLIST" >/dev/null 2>&1; then
              echo "Key $key already present, skip"
            else
              /usr/libexec/PlistBuddy -c "Add :$key $type $value" "$APP_PLIST"
              echo "Added $key"
            fi
          }
          # 保存图片到相册权限说明（pldownloader 必需，缺失会导致保存时崩溃）
          add_key "NSPhotoLibraryAddUsageDescription" "string" "需要访问相册以将你生成的图片保存到照片库"
          # 允许通过"文件"App 访问应用文档（便于导出 JSON 等）
          add_key "UIFileSharingEnabled" "bool" "true"
          add_key "LSSupportsOpeningDocumentsInPlace" "bool" "true"
          # 设置应用语言为中文（确保系统对话框、长按菜单等显示中文）
          /usr/libexec/PlistBuddy -c "Delete :CFBundleDevelopmentRegion" "$APP_PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleDevelopmentRegion string zh_CN" "$APP_PLIST"
          /usr/libexec/PlistBuddy -c "Delete :CFBundleLocalizations" "$APP_PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleLocalizations array" "$APP_PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleLocalizations:0 string zh_CN" "$APP_PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleLocalizations:1 string en" "$APP_PLIST"
          echo "Set locale: CFBundleDevelopmentRegion=zh_CN, CFBundleLocalizations=[zh_CN, en]"

      # 前端由 beforeBuildCommand（npm run build:tauri）在 tauri 构建时构建，服务器地址在步骤级提供
      - name: Build iOS IPA
        env:
          NEXT_PUBLIC_SERVER_URL: ${{ env.SERVER_URL }}
        run: |
          if [ "$IS_DEBUG" = "true" ]; then
            npx tauri ios build --target aarch64 --no-sign --debug
          else
            npx tauri ios build --target aarch64 --no-sign
          fi

      - name: Upload IPA (debug)
        if: env.IS_DEBUG == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bili-live-ios-debug
          path: |
            src-tauri/gen/apple/build/*/*.ipa
            src-tauri/gen/ios/build/*/*.ipa

      - name: Upload IPA (release)
        if: env.IS_DEBUG != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bili-live-ios
          path: |
            src-tauri/gen/apple/build/*/*.ipa
            src-tauri/gen/ios/build/*/*.ipa

  # ==================== 发布客户端产物到服务器 ====================
  # 将 exe/apk/ipa 三种平台产物按构建时间打包发布到服务器：
  #   ${TARGET_DIR}/artifacts/release-<构建时间戳>/  -> 本次 run 的所有平台产物（归组）
  #   ${TARGET_DIR}/artifacts/current_exe            -> 指向最新 exe
  #   ${TARGET_DIR}/artifacts/current_apk            -> 指向最新 apk
  #   ${TARGET_DIR}/artifacts/current_ipa            -> 指向最新 ipa
  #   ${TARGET_DIR}/artifacts/versions.json          -> 各平台当前版本构建日期（供 landing 页角标显示）
  # 构建时间戳取本次 workflow run 的 created_at（同一 run 内所有作业共享同一值），
  # 与 deploy-server 的 .releases 原子版本管理同一模式；旧版本只保留最近 10 个。
  publish-artifacts:
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'exe') || contains(github.event.head_commit.message, 'apk') || contains(github.event.head_commit.message, 'ipa')) }}
    needs: [build-exe, build-apk, build-ipa]
    runs-on: ubuntu-latest
    steps:
      - name: Download all client artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "bili-live-*"
          path: artifacts-dl
          if-no-files-found: ignore

      - name: Resolve build timestamp
        id: ts
        run: |
          TS_RAW="$(curl -sS -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            | jq -r '.created_at' 2>/dev/null || true)"
          # created_at 为 UTC（如 2026-08-15T03:46:59Z），转成东八区（Asia/Shanghai）：
          # 本地 0-8 点构建时 UTC 日期仍是前一天，若不转换，目录名/landing 日期会落后一天。
          BUILD_TS="$(TZ=Asia/Shanghai date -d "${TS_RAW}" +%Y%m%d-%H%M%S 2>/dev/null || true)"
          # 必须校验为合法时间戳（YYYYMMDD-HHMMSS）。
          # 注意：API 失败时 jq -r '.created_at' 会输出字面字符串 "null"（非空），
          # 此时 date -d 解析失败、BUILD_TS 为空，落到下面的东八区当前时间兜底。
          if ! [[ "${BUILD_TS}" =~ ^[0-9]{8}-[0-9]{6}$ ]]; then
            BUILD_TS="$(TZ=Asia/Shanghai date +%Y%m%d-%H%M%S)"
          fi
          echo "BUILD_TS=${BUILD_TS}"
          echo "BUILD_TS=${BUILD_TS}" >> "$GITHUB_OUTPUT"

      - name: Prepare publish files
        id: prepare
        run: |
          set -e
          mkdir -p publish
          EXE="$(find artifacts-dl -type f -name '*.exe' | head -n1 || true)"
          # APK 优先取 universal 变体（避免同时存在通用包/特定包时选错）
          APK="$(find artifacts-dl -type f -name '*.apk' | grep universal | head -n1 || true)"
          [ -n "${APK}" ] || APK="$(find artifacts-dl -type f -name '*.apk' | head -n1 || true)"
          IPA="$(find artifacts-dl -type f -name '*.ipa' | head -n1 || true)"
          if [ -n "${EXE}" ]; then cp "${EXE}" publish/; fi
          if [ -n "${APK}" ]; then cp "${APK}" publish/; fi
          if [ -n "${IPA}" ]; then cp "${IPA}" publish/; fi
          echo "发布文件:"
          ls -la publish/
          echo "HAS_FILES=$([ -n "$(ls -A publish 2>/dev/null)" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Upload artifacts to server (staging)
        if: steps.prepare.outputs.HAS_FILES == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: publish/*
          target: /tmp/bili_live-artifacts
          overwrite: true
          strip_components: 1

      - name: Atomic publish on server
        if: steps.prepare.outputs.HAS_FILES == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 10m
          script: |
            set -e
            TARGET_DIR="${{ secrets.SSH_TARGET_DIR }}"
            ARTIFACTS_DIR="${TARGET_DIR}/artifacts"
            RELEASE_DIR="${ARTIFACTS_DIR}/release-${{ steps.ts.outputs.BUILD_TS }}"
            mkdir -p "${ARTIFACTS_DIR}" "${RELEASE_DIR}"
            cp -a /tmp/bili_live-artifacts/. "${RELEASE_DIR}/"
            # 更新各平台 current 链接（仅当本次含该平台产物时更新，其余保持指向旧版）
            if ls "${RELEASE_DIR}"/*.exe >/dev/null 2>&1; then
              ln -sfn "$(ls "${RELEASE_DIR}"/*.exe | head -n1)" "${ARTIFACTS_DIR}/current_exe"
            fi
            if ls "${RELEASE_DIR}"/*.apk >/dev/null 2>&1; then
              ln -sfn "$(ls "${RELEASE_DIR}"/*.apk | head -n1)" "${ARTIFACTS_DIR}/current_apk"
            fi
            if ls "${RELEASE_DIR}"/*.ipa >/dev/null 2>&1; then
              ln -sfn "$(ls "${RELEASE_DIR}"/*.ipa | head -n1)" "${ARTIFACTS_DIR}/current_ipa"
            fi

            # ---- 生成各平台当前版本日期 versions.json（供 landing 页显示构建日期）----
            # 日期从 current_* 链接指向的实际安装包所在 release-<日期>-<时间> 目录名中提取，
            # 只取日期部分（YYYY-MM-DD，不含时间）。每次发布都从 current 链接实时解析，
            # 因此本次未更新的平台仍会保留旧版本日期。
            extract_date() {
              local link="$1"
              local target rel
              target="$(readlink -f "${link}" 2>/dev/null || true)"
              [ -z "${target}" ] && return 1
              rel="${target#*release-}"
              case "${rel}" in
                [0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]-[0-9][0-9][0-9][0-9][0-9][0-9]*)
                  echo "${rel:0:4}-${rel:4:2}-${rel:6:2}"
                  return 0
                  ;;
              esac
              return 1
            }
            W_DATE="$(extract_date "${ARTIFACTS_DIR}/current_exe")" || true
            A_DATE="$(extract_date "${ARTIFACTS_DIR}/current_apk")" || true
            I_DATE="$(extract_date "${ARTIFACTS_DIR}/current_ipa")" || true
            VJSON="{\n"
            VSEP=""
            add_ver() {
              local key="$1" val="$2"
              [ -z "${val}" ] && return 0
              VJSON="${VJSON}${VSEP}  \"${key}\": \"${val}\""
              VSEP=",\n"
            }
            add_ver "windows" "${W_DATE}"
            add_ver "android" "${A_DATE}"
            add_ver "ios" "${I_DATE}"
            VJSON="${VJSON}\n}"
            printf '%b' "${VJSON}" > "${ARTIFACTS_DIR}/versions.json"
            echo "versions.json:"
            cat "${ARTIFACTS_DIR}/versions.json"

            echo "发布完成 -> ${RELEASE_DIR}"
            ls -la "${RELEASE_DIR}"
            echo "artifacts 目录:"
            ls -la "${ARTIFACTS_DIR}"
            # 清理旧版本，保留最近 10 个
            ls -1dt "${ARTIFACTS_DIR}"/release-* 2>/dev/null | tail -n +11 | xargs -r rm -rf