            }
            W_META="$(extract_meta "${ARTIFACTS_DIR}/current_exe")" || true
            A_META="$(extract_meta "${ARTIFACTS_DIR}/current_apk")" || true
            I_META="$(extract_meta "${ARTIFACTS_DIR}/current_ipa")" || true
            W_VER="${W_META%%|*}"; W_DATE="${W_META#*|}"
