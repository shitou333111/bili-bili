name: Build Mobile Apps

on:
  push:
    branches: [ main, native-client ]
  workflow_dispatch:
    inputs:
      platform:
        description: "构建平台"
        required: true
        type: choice
        options:
          - android
          - ios
          - both
      server_url:
        description: "服务器地址"
        required: false
        type: string
        default: "http://192.168.1.2:3000"

concurrency:
  group: build-mobile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ==================== Android ====================
  build-android:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, 'mobile')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0 ndk;27.0.12077973"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@latest

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend
        env:
          NEXT_PUBLIC_SERVER_URL: ${{ inputs.server_url || secrets.NEXT_PUBLIC_SERVER_URL }}
        run: npm run build:tauri

      - name: Build Android APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
          JAVA_HOME: ${{ env.JAVA_HOME }}
        run: cargo tauri android build --target aarch64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bili-live-android
          path: src-tauri/gen/android/app/build/outputs/apk/release/*.apk

  # ==================== iOS ====================
  build-ios:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, 'mobile')) }}
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,x86_64-apple-ios,aarch64-apple-ios-sim

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@latest

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend
        env:
          NEXT_PUBLIC_SERVER_URL: ${{ inputs.server_url || secrets.NEXT_PUBLIC_SERVER_URL }}
        run: npm run build:tauri

      - name: Build iOS IPA
        run: cargo tauri ios build --target aarch64-apple-ios

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: bili-live-ios
          path: src-tauri/gen/ios/build/*.ipa