<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>直播姬浏览器源 · 透明视频测试</title>
  <style>
    /* 关键：html/body 背景完全透明 */
    html,
    body {
      margin: 0;
      padding: 0;
      background: transparent !important;
      overflow: hidden;
    }
    * { box-sizing: border-box; }

    /* 900×560 视口 */
    .scene {
      position: relative;
      width: 900px;
      height: 560px;
    }

    .tip {
      position: absolute;
      left: 40px;
      top: 16px;
      color: #fff;
      font: 700 20px/1.5 Arial, sans-serif;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.8);
    }

    video.a {
      position: absolute;
      top: 90px;
      width: 300px;
      height: 225px;
    }
    video.a.v1 { left: 80px; }
    video.a.v2 { left: 520px; }

    .label {
      position: absolute;
      top: 330px;
      color: #fff;
      font: 700 18px/1 Arial, sans-serif;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.8);
      text-align: center;
      width: 300px;
    }
    .label.l1 { left: 80px; }
    .label.l2 { left: 520px; }
  </style>
</head>
<body>
  <div class="scene">
    <div class="tip">透明视频测试：判断点是视频矩形内部<br />透出底层 = 视频 alpha 生效；黑底 = 不支持</div>
    <video class="a v1" autoplay loop muted playsinline>
      <source src="sample_vp8.webm" type="video/webm" />
    </video>
    <video class="a v2" autoplay loop muted playsinline>
      <source src="sample_vp9.webm" type="video/webm" />
    </video>
    <div class="label l1">VP8 alpha</div>
    <div class="label l2">VP9 alpha</div>
  </div>
</body>
</html>
