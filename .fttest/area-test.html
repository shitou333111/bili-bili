<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FoamTree 面积比例 + 中心测试</title>
<style>
  body { margin: 0; background: #eee; font-family: monospace; font-size: 12px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; padding: 8px; }
  .box { width: 320px; height: 520px; position: relative; overflow: hidden; background: #f6f1e9; border: 1px solid #999; }
  #out { padding: 8px 12px; white-space: pre-wrap; background: #fff; min-height: 200px; }
</style>
</head>
<body>
<div class="row">
  <div><div class="box" id="c1"></div><div>cfg1: 透明gif logo (HEAD)</div></div>
  <div><div class="box" id="c2"></div><div>cfg2: attributionDistanceFromCenter=2 (当前)</div></div>
  <div><div class="box" id="c3"></div><div>cfg3: 无logo相关选项(纯默认)</div></div>
</div>
<div id="out">loading...</div>
<script src="/node_modules/@carrotsearch/foamtree/foamtree.min.js"></script>
<script>
const FoamTree = window.CarrotSearchFoamTree;
const out = document.getElementById("out");
const log = (m) => { out.textContent += m + "\n"; };

// 真实主播数据（41个，coins 从 13560 到 1）
const REAL = [
  13560,6804,5316,5111,4039,1831,1430,1390,1380,1380,
  1200,1100,1000,900,880,800,700,650,600,550,
  500,450,400,380,350,300,280,250,220,200,
  180,150,120,100,80,60,40,20,10,5,1,
];
const groups = REAL.map((v,i)=>({
  id: i+1, label:"G"+i, weight: Math.sqrt(v),
  color: ["#e8ddd0","#ddd2c5","#e3d9cc","#d4c9bc","#ebe2d6","#d9cfc2","#e0d6ca","#d1c7ba","#e6ddd1","#d6ccc0"][i%10],
  name:"G"+i, value: v,
}));

function polygonBBox(poly){let a=1e9,b=1e9,c=-1e9,d=-1e9;for(const p of poly){a=Math.min(a,p.x);b=Math.min(b,p.y);c=Math.max(c,p.x);d=Math.max(d,p.y);}return {a,b,c,d};}
function polyArea(poly){let s=0;for(let i=0;i<poly.length;i++){const p=poly[i],q=poly[(i+1)%poly.length];s+=p.x*q.y-q.x*p.y;}return Math.abs(s)/2;}

function build(el, cfg){
  const common = {
    element: el, pixelRatio: 1, layout:"relaxed", stacking:"flattened",
    layoutByWeightOrder:true, relaxationInitializer:"fisheye",
    descriptionGroup:false, descriptionGroupSize:0, descriptionGroupMinHeight:0,
    groupLabelDecorator:(o,p,v)=>{v.labelText="";}, groupLabelFontSize:0, groupLabelMinFontSize:0,
    groupBorderWidth:0, groupInsetWidth:0, groupStrokeType:"none", groupStrokeWidth:0,
    groupFillType:"plain", groupBorderRadius:0,
    wireframeDrawingTimeout:0, wireframeLabelDrawingTimeout:0, wireframeContentDecorationDrawing:"always",
    finalCompleteDrawMaxDuration:0, finalIncrementalDrawMaxDuration:0, fadeDuration:0,
    groupContentDecoratorTriggering:"onSurfaceDirty",
    attributionWeight:0, attributionText:"",
    backgroundColor:"#f6f1e9",
    groupColorDecorator:(o,p,v)=>{v.groupColor=p.group.color||"#f6f1e9";},
    dataObject:{groups},
  };
  if(cfg==="head"){
    common.attributionLogo="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==";
  } else if(cfg==="current"){
    common.attributionDistanceFromCenter=2;
  }
  return new FoamTree(common);
}

const ft1=build(document.getElementById("c1"),"head");
const ft2=build(document.getElementById("c2"),"current");
const ft3=build(document.getElementById("c3"),"none");

function dump(tag, ft){
  log(`===== ${tag} =====`);
  // 通过 drawTo / redraw 后读取每个 group 的 polygon 面积（用 onRedraw 内部状态不可靠，改用渲染后 canvas 采样太慢，
  // 这里直接使用 FoamTree 公开的 get('geometry') 或 state —— 不提供，因此改用 canvas 主区域采样不可行。
  // 改为通过 groupContentDecorator 捕获 polygon（每个实例注册捕获器）。
}
window.__dumps = {};

// 通过 groupContentDecorator 捕获每个 group 的 polygon
function captureFor(ft, tag){
  ft.set("groupContentDecorator",(o,p,v)=>{
    if(!window.__dumps[tag]) window.__dumps[tag]={};
    const node=p.group, poly=p.polygon;
    if(node && poly && poly.length>2){
      window.__dumps[tag][node.id]={ area: polyArea(poly), cx:(poly.reduce((s,p)=>s+p.x,0)/poly.length), cy:(poly.reduce((s,p)=>s+p.y,0)/poly.length) };
    }
  });
}
captureFor(ft1,"head");
captureFor(ft2,"current");
captureFor(ft3,"none");

setTimeout(()=>{
  ["head","current","none"].forEach(tag=>{
    const d=window.__dumps[tag];
    if(!d){ log(`${tag}: 无捕获数据`); return; }
    const ids=Object.keys(d).map(Number).sort((a,b)=>b-a);
    const largest=d[ids[0]];
    log(`[${tag}] group数=${ids.length}`);
    // 面积是否与 sqrt(value) 成比例：比较前5大
    const areaRatios=[];
    for(let k=0;k<5;k++){
      const id=ids[k];
      const expect=Math.sqrt(REAL[id-1]);
      const ratio=d[id].area/expect;
      areaRatios.push(`${id}(${REAL[id-1]})a=${Math.round(d[id].area)}/sqrt=${expect.toFixed(1)}r=${ratio.toFixed(2)}`);
    }
    log(`[${tag}] 前5大 cell 面积: ${areaRatios.join(" ; ")}`);
    // 中心位置（画布中心）
    const el=document.getElementById(tag==="head"?"c1":tag==="current"?"c2":"c3");
    const cvs=el.querySelector("canvas");
    const W=cvs?cvs.width:0, H=cvs?cvs.height:0;
    log(`[${tag}] 画布 ${W}x${H}，最大cell(${ids[0]})中心=(${largest.cx.toFixed(0)},${largest.cy.toFixed(0)}) 画布中心=(${W/2},${H/2})`);
  });
}, 2000);
</script>
</body>
</html>
