# Windows 构建工具固定指向（VS 更新后 SDK 组件与 VS 注册表发现键丢失，rustc/tauri-winres 均找不到工具）：
# - RC：从官方 NuGet 包 Microsoft.Windows.SDK.BuildTools 提取出的 rc.exe（C:\Users\song\.winsdk-tools）
# - linker：VS2022 Community MSVC 工具集里的 link.exe
# - LIB：Windows SDK um/ucrt 库（kernel32.lib 等，取自 NuGet Microsoft.Windows.SDK.CPP.x64）+ MSVC CRT 库
# - CC/CXX/AR/INCLUDE：MSVC 的 cl.exe/lib.exe 及 SDK/UCRT 头（vswhom-sys 等 cc-rs 构建脚本编译 C/C++ 用）
[env]
RC = { value = "C:\\Users\\song\\.winsdk-tools\\rc.exe", force = false }
LIB = { value = "C:\\Users\\song\\.winsdk-tools\\lib\\um-x64;C:\\Users\\song\\.winsdk-tools\\lib\\ucrt-x64;C:\\Program Files\\Microsoft Visual Studio\\2022\\Community\\VC\\Tools\\MSVC\\14.44.35207\\lib\\x64", force = false }
CC_x86_64_pc_windows_msvc = { value = "C:\\Program Files\\Microsoft Visual Studio\\2022\\Community\\VC\\Tools\\MSVC\\14.44.35207\\bin\\Hostx64\\x64\\cl.exe", force = false }
CXX_x86_64_pc_windows_msvc = { value = "C:\\Program Files\\Microsoft Visual Studio\\2022\\Community\\VC\\Tools\\MSVC\\14.44.35207\\bin\\Hostx64\\x64\\cl.exe", force = false }
AR_x86_64_pc_windows_msvc = { value = "C:\\Program Files\\Microsoft Visual Studio\\2022\\Community\\VC\\Tools\\MSVC\\14.44.35207\\bin\\Hostx64\\x64\\lib.exe", force = false }
INCLUDE = { value = "C:\\Program Files\\Microsoft Visual Studio\\2022\\Community\\VC\\Tools\\MSVC\\14.44.35207\\include;C:\\Users\\song\\.winsdk-tools\\include\\ucrt;C:\\Users\\song\\.winsdk-tools\\include\\shared;C:\\Users\\song\\.winsdk-tools\\include\\um", force = false }

[target.x86_64-pc-windows-msvc]
linker = "C:\\Program Files\\Microsoft Visual Studio\\2022\\Community\\VC\\Tools\\MSVC\\14.44.35207\\bin\\Hostx64\\x64\\link.exe"
