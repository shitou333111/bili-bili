[package]
name = "bili-live"
version = "1.0.0"
description = "Bili Live - B站直播数据分析工具"
authors = ["you"]
edition = "2021"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# 仅 Android：用于 JNI 调用 Activity.finish()，让面板 Activity 真正结束并从返回栈移除
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

# 仅移动端：iOS 上把 WKWebView 的 contentInsetAdjustmentBehavior 设为 .never，
# 关闭系统自动施加的安全区内边距，让 Web 内容真正铺满全屏（edge-to-edge），
# env(safe-area-inset-*) 才返回真实值 —— 修复 iOS 竖屏直播视频上下黑边问题。
# Android 上为 no-op。
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-ios-webview-insets = "=0.1.0"

[dependencies]
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-http = { version = "2", features = ["unsafe-headers"] }
tauri-plugin-fs = "2"
tauri-plugin-store = "2"
tauri-plugin-opener = "2"
tauri-plugin-pldownloader = "1.0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
