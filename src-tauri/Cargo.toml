[package]
name = "bili-live"
version = "1.0.0"
description = "Bili Live - B站直播数据分析工具"
authors = ["you"]
edition = "2021"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# 仅 Android：用于 JNI 调用 Activity.finish()，让面板 Activity 真正结束并从返回栈移除
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

# 仅移动端：iOS 上把 WKWebView 的 contentInsetAdjustmentBehavior 设为 .never，
# 关闭系统自动施加的安全区内边距，让 Web 内容真正铺满全屏（edge-to-edge），
# env(safe-area-inset-*) 才返回真实值 —— 修复 iOS 竖屏直播视频上下黑边问题。
# Android 上为 no-op。
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-ios-webview-insets = "=0.1.0"

# 仅 Windows：原地替换更新（绿色单文件免安装方案的持久化更新）。
# 用 OpenProcess/WaitForSingleObject 等待旧进程退出，之后才能替换被锁定的 exe 文件。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
# unsafe-headers: 允许设置 Referer 等 header（B站 API 需要）
tauri-plugin-http = { version = "2", features = ["unsafe-headers"] }
tauri-plugin-fs = "2"
tauri-plugin-store = "2"
tauri-plugin-opener = "2"
tauri-plugin-pldownloader = "1.0.1"
# APK 安装插件（Android 功能）：替换手写 JNI 的 install_apk 实现。
# 插件自带 FileProvider + REQUEST_INSTALL_PACKAGES 权限（manifest 自动合并），
# 提供 install / canInstall / requestInstallPermission 命令。
# 须作为全局依赖声明：否则 Windows/iOS 构建时 tauri-build 不认识
# android-installer:default 权限，capabilities 校验报错。桌面/iOS 端插件内部为
# no-op stub，仅 Android 生效（功能上仍是"仅安卓平台"）。
tauri-plugin-android-installer = "0.1"
# 分享插件（iOS/Android/macOS/Windows）：iOS 端用 UIActivityViewController 弹出分享面板，
# 把已下载的 IPA 文件交给自签工具（Esign/Feather）覆盖安装（替代 opener 的 UIApplication.open，
# 后者无法处理 IPA 格式，报"格式不正确"）。
tauri-plugin-sharekit = "0.3"
# 热更新（三平台通用）：前端资源 OTA，类似 CodePush，仅更新 JS/CSS/HTML。
# tauri-plugin-hotswap：运行时替换 asset provider，apply/activate 后
# window.location.reload() 立即生效（无需重启进程，iOS/Android 均可）。
# 默认 tar.gz bundle；如改发 zip 需开启 features = ["zip"]。
tauri-plugin-hotswap = "0.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# tokio：with_timeout 用的 tokio::time::timeout（各命令请求超时，配合全局 reqwest Client 复用）
tokio = { version = "1", features = ["time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# 本地 vendor 的 tauri-plugin-hotswap：修复 Android 热更新目录路径（identifier 含 '-'，
# 而 Android 包名将其替换为 '_'，原插件硬编码 /data/data/<identifier>/ 指向不存在目录，
# 导致 apply 时 create_dir_all 报 EACCES 13 "I/O ERROR: Permission denied"）。
[patch.crates-io]
tauri-plugin-hotswap = { path = "vendor/tauri-plugin-hotswap" }
